name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: 全量回归（离线可复现）
        run: python -m pytest tests/ -q
      - name: 评测回归门（gold 集，低于阈值失败）
        run: python scripts/evaluation_gate.py --output eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results.json

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  postgres-compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dra
          POSTGRES_PASSWORD: dra
          POSTGRES_DB: dra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dra -d dra"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      OPENAI_API_KEY: sk-dummy
      TEST_POSTGRES_URL: postgresql+asyncpg://dra:dra@127.0.0.1:5432/dra
      APP_DATABASE_URL: postgresql+asyncpg://dra:dra@127.0.0.1:5432/dra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: 迁移链（空库 upgrade head）
        run: PYTHONPATH=src:. python -m alembic upgrade head
      - name: 方言一致性 + 全量回归（PG 后端）
        run: python -m pytest tests/ -q

  kafka-compat:
    # T-010：可选 Kafka 传输层；真实 broker 由 service 容器提供（本机无 Docker 需求）。
    # 双监听器：INTERNAL 供容器网络内消费，EXTERNAL 广播 localhost 供 runner 连接
    runs-on: ubuntu-latest
    services:
      kafka:
        image: bitnami/kafka:3.7
        env:
          KAFKA_CFG_NODE_ID: "0"
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports: ["9094:9094"]
        options: >-
          --health-cmd "kafka-broker-api-versions.sh --bootstrap-server localhost:9094"
          --health-interval 10s --health-timeout 10s --health-retries 24
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy' }}
      TEST_KAFKA_BOOTSTRAP: localhost:9094
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Kafka 队列与事件流回归（真实 broker）
        run: |
          python -m pytest tests/harness/test_run_queue.py -q
          python -m pytest tests/acceptance/test_events_kafka.py -q

  backup-restore-drill:
    # T-004：PG 备份演练 + 真实 pg_restore 到 scratch 库（恢复路径真实执行）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dra
          POSTGRES_PASSWORD: dra
          POSTGRES_DB: dra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dra -d dra"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://dra:dra@127.0.0.1:5432/dra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # runner 自带 client 为 PG16，pg_dump 无法导出 PG17 服务端 —— 安装 PG17 客户端
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo sh -c 'wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor > /etc/apt/trusted.gpg.d/pgdg.gpg'
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-ci.txt
      - name: 迁移链（空库 upgrade head，为演练准备真实 schema）
        run: PYTHONPATH=src:. python -m alembic upgrade head
        env:
          APP_DATABASE_URL: postgresql+asyncpg://dra:dra@127.0.0.1:5432/dra
      - name: 备份恢复演练（真实 PG：dump → pg_restore 到 scratch 库 → verify）
        run: |
          PYTHONPATH=src:. python -m scripts.backup_drill --target postgres \
            --dsn postgresql+asyncpg://dra:dra@127.0.0.1:5432/dra \
            --restore-dsn postgresql+asyncpg://dra:dra@127.0.0.1:5432/dra_restore \
            --output output/backup-drill.json
      - name: 演练报告阈值门禁（RTO < 60m 且 PASS）
        run: python scripts/backup_drill_gate.py output/backup-drill.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-drill-report
          path: output/backup-drill.json
