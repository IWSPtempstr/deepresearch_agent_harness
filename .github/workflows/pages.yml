name: Deploy static portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/portfolio.html"
      - "frontend/src/portfolio/**"
      - "frontend/vite.config.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build static portfolio
        run: npm run build:portfolio
        working-directory: frontend
        env:
          PORTFOLIO_BASE: /${{ github.event.repository.name }}/
      - name: Configure GitHub Pages
        id: configure-pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/portfolio-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
