services:
  neo4j:
    image: neo4j:5.22.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: "1G"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "1G"
      NEO4J_apoc_trigger_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      FASTAPI_WORKERS: "1"
      # P0 平台模式：PG 主存 + 队列；Run 执行由 worker 服务消费。
      # T-010：.env 设 KAFKA_BOOTSTRAP_SERVERS 时唤醒信号改走 Kafka；
      # REDIS_URL 置空 + 不启动 redis 服务需配合 compose --profile kafka 使用
      APP_DATABASE_URL: "postgresql+asyncpg://dra:${POSTGRES_PASSWORD}@postgres:5432/dra"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-}"
      ARTIFACT_ROOT: "/app/data/artifacts"
      SKILLS_ROOT: "/app/skills"
      NEO4J_URI: "bolt://neo4j:7687"
      FRONTEND_ORIGINS: "http://127.0.0.1:${FRONTEND_PORT:-5173},http://localhost:${FRONTEND_PORT:-5173}"
      # T-005：生产模式启动不执行应用内 DDL；schema 由镜像 CMD 的 alembic upgrade head 先行完成
      SCHEMA_BOOTSTRAP_ON_STARTUP: "false"
    ports:
      - "127.0.0.1:8000-8001:8000"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      - ./files:/app/files
      - ./cache:/app/cache
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10

  postgres:
    # 平台模式主存储；pgvector 镜像为后续缓存层向量迁移预留
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dra
      POSTGRES_PASSWORD: \"${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}\"
      POSTGRES_DB: dra
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dra -d dra"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    # P0-2/P0-3/P0-4 使用：Run 队列、SSE 扇出（本地单机模式可不依赖）
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    # T-010 可选 profile：Run 唤醒信号改走 Kafka；Redis 仍用于 SSE 实时扇出
    image: apache/kafka:3.9.2
    profiles: ["kafka"]
    restart: unless-stopped
    environment:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 24

  worker:
    # P0-2：Run 执行进程；scale 方式扩容：docker compose up --scale worker=2
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DATABASE_URL: "postgresql+asyncpg://dra:${POSTGRES_PASSWORD}@postgres:5432/dra"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-}"
      ARTIFACT_ROOT: "/app/data/artifacts"
      SKILLS_ROOT: "/app/skills"
      NEO4J_URI: "bolt://neo4j:7687"
    # schema 迁移带重试：与 api 并发启动时 alembic 可能撞车，重试后为幂等空操作
    # T-005：迁移作为独立步骤先行（scripts/migrate.py 带锁竞争重试），worker 启动不再执行 DDL
    command: ["sh", "-c", "python scripts/migrate.py && SCHEMA_BOOTSTRAP_ON_STARTUP=false python -m deepresearch_agent.worker"]
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      - ./files:/app/files
      - ./cache:/app/cache
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    # P1-7：抓取 backend:/api/v1/metrics
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: \"${GRAFANA_ADMIN_PASSWORD:-admin}\"
    volumes:
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/dra-runtime.json:ro
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/dra.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dra.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_backups:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
